name: Test and build add-on images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r rootfs/opt/hometunnel/requirements.txt
        working-directory: hometunnel-client
      - run: python -m unittest discover -s tests
        working-directory: hometunnel-client
      - run: python tests/integration_runtime.py
        working-directory: hometunnel-client
      - run: sh -n rootfs/start.sh
        working-directory: hometunnel-client
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r rootfs/opt/hometunnel/requirements.txt
        working-directory: hometunnel-client
      - name: Secret scan (verified release binary; redact findings)
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned release image
        env:
          ADDON_ARCH: ${{ matrix.arch }}
        run: |
          version=$(python3 -c 'import re; print(re.search(r"version: \"([^\"]+)\"", open("hometunnel-client/config.yaml").read())[1])')
          image="ghcr.io/hometunnel/${ADDON_ARCH}-addon-hometunnel_client:${version}"
          echo "RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --pull --label "org.opencontainers.image.version=$version" --label "org.opencontainers.image.licenses=GPL-3.0-only" --label "org.opencontainers.image.source=https://github.com/HomeTunnel/ht-home-assistant-addon" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$image" hometunnel-client
      - name: Check runtime imports and NetBird CLI
        run: |
          docker run --rm --entrypoint python3 "$RELEASE_IMAGE" -c 'import sys; sys.path.insert(0, "/opt/hometunnel"); import app; print("Runtime imports passed")'
          docker run --rm --entrypoint netbird "$RELEASE_IMAGE" version
      - name: Audit operating system and runtime dependencies
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.74.0 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$RELEASE_IMAGE"
      - name: Publish versioned image
        if: github.event_name != 'pull_request'
        run: docker push "$RELEASE_IMAGE"

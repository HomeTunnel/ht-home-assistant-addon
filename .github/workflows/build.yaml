name: Build add-on images

# Builds the HomeTunnel Client add-on images on GitHub's runners and publishes
# them to GHCR, so that Home Assistant Supervisor can PULL a ready-made image
# instead of running a full `docker buildx build` on the user's device. That
# on-device build is what starved Home Assistant Core on low-power hardware
# (e.g. Raspberry Pi 3) during install/update.
#
# - Pull requests: build only (`--test`), no login, no push.
# - Pushes to main / published releases: build and push to
#   ghcr.io/hometunnel/{arch}-addon-hometunnel_client, tagged with the version
#   from config.yaml.

on:
  push:
    branches: [main]
    paths:
      - "hometunnel-client/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "hometunnel-client/**"
      - ".github/workflows/build.yaml"
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        # Only needed when we actually push (not on pull requests).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }} add-on image
        uses: home-assistant/builder@2024.03.5
        with:
          args: >-
            ${{ github.event_name == 'pull_request' && '--test' || '' }}
            --${{ matrix.arch }}
            --target hometunnel-client
            --image "{arch}-addon-hometunnel_client"
            --docker-hub "ghcr.io/hometunnel"
            --addon

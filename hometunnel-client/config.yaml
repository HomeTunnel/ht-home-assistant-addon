name: HomeTunnel Client
slug: hometunnel_client
description: Secure remote access to Home Assistant through your HomeTunnel account — private encrypted tunnel, no port forwarding.
version: "2.0.1"
url: https://github.com/HomeTunnel/ht-home-assistant-addon
image: ghcr.io/hometunnel/{arch}-addon-hometunnel_client
arch:
  - aarch64
  - amd64
# Not supported on the Raspberry Pi 3 (1 GB RAM). HomeTunnel runs alongside Home
# Assistant Core; on 1 GB hosts the combined memory use exhausts RAM and can
# freeze the whole device. Excluding the board here stops Supervisor from
# offering/installing the add-on on a Pi 3 (all other machines remain supported).
machine:
  - "!raspberrypi3"
  - "!raspberrypi3-64"
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
devices:
  - /dev/net/tun
privileged:
  - NET_ADMIN
panel_icon: mdi:lan-connect
panel_title: HomeTunnel
homeassistant_api: true
hassio_api: true
watchdog: http://[HOST]:[PORT:8099]/health
options:
  log_level: info
  allow_low_memory: false
schema:
  log_level: "list(trace|debug|info|warn|error)"
  allow_low_memory: "bool?"
